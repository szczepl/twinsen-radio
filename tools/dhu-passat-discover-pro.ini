; Desktop Head Unit - profil odwzorowujacy Passata B8 MY2020 z Discover Pro 9,2".
;
; Natywna geometria panelu to 1280x640. DHU przyjmuje tylko 800x480, 1280x720
; i 1920x1080, wiec robimy ja marginesem - sztuczka z default_wide.ini Google'a.
; marginheight to LACZNA obcinana wysokosc, nie na strone.
;
; Gestosc 213 dpi (tvdpi), a nie fizyczne 156. Glowica dobiera gestosc do
; odleglosci patrzenia: ekran w aucie oglada sie z okolo 70 cm zamiast 30 cm jak
; telefon, wiec deklaruje wiecej, niz wynika z przekatnej.
;
; Dlaczego akurat 213, a nie 240 - to nie jest kwestia gustu, tylko twardego
; ograniczenia. Android Auto wymaga co najmniej 480 dp wysokosci:
;
;   640 px / (213/160) = 481 dp  -> polaczenie wstaje, pasek aplikacji na DOLE
;   640 px / (240/160) = 427 dp  -> telefon zrywa lacze zaraz po TLS:
;                                   "Failed to read from transport - disconnect"
;
; Przy 240 dpi udawalo sie polaczyc wylacznie bez marginesu (720 px = rowne
; 480 dp), ale wtedy proporcje wynosza 1,78 zamiast 2,00 i obraz jest za duzy
; w porownaniu ze zdjeciami z auta. Ten profil daje jedno i drugie naraz:
; natywna geometrie i pasek na dole.
;
; Uwaga na gestosci spoza standardowych kubelkow Androida (160/213/240/320) -
; przy 200 dpi projekcja wstawala z dzwiekiem, ale bez obrazu.

; Zadnych dodatkowych okien poza samym ekranem projekcji:
;
;   instrumentcluster - kanal clustera w protokole Android Auto przenosi
;     WYLACZNIE nawigacje (w binarce DHU sa tylko komunikaty
;     INSTRUMENT_CLUSTER_NAVIGATION_*). To okno nigdy nie pokaze tego, co
;     Passat rysuje na Active Info Display podczas odtwarzania muzyki - AID
;     renderuje samo auto z pol MediaMetadata. Emulatora AID w publicznym SDK
;     nie ma; miewaja go zapewne firmy piszace oprogramowanie na zlecenie VW.
;
;   playbackstatus - okno "Media Playback Status" bylo przydatne, gdy
;     ustalalismy, ktore pole gdzie trafia. Pomiar w aucie jest zrobiony
;     (BADANIA.md), a okno dodatkowo czyta UTF-8 jak Latin-1 i psuje polskie
;     znaki. Do podgladu metadanych sluzy teraz `dhu.bat log`.

[general]
touch = true
touchpad = false
touchpadnavigation = false
controller = false
instrumentcluster = false
playbackstatus = false
resolution = 1280x720
marginheight = 80
dpi = 213
framerate = 30

[sensors]
location = true
night_mode = true
driving_status = true
