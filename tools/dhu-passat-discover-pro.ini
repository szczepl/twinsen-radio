; Desktop Head Unit - VW Discover Pro 9,2" (MIB2.5/MIB3), Passat B8 MY2020.
;
; Realny panel ma 1280x640, a DHU przyjmuje tylko 800x480, 1280x720 i 1920x1080.
; Obchodzimy to tak, jak robi to sam Google w default_wide.ini: bierzemy
; 1280x720 i obcinamy marginesem 80 px wysokosci, co daje dokladnie 1280x640.
;
; Uwaga co do ukladu: przy tak szerokim ekranie Android Auto wlacza pulpit
; Coolwalk - mapa po prawej, odtwarzacz po lewej, pasek aplikacji z lewej
; krawedzi. To decyzja glowicy na podstawie geometrii, nie aplikacji; my tego
; nie przestawimy. Zeby zobaczyc odtwarzacz na calym ekranie z kontrolkami
; na dole, uzyj profilu dhu-passat-composition.ini (800x480).

[general]
touch = true
touchpad = false
touchpadnavigation = false
controller = false
instrumentcluster = true
playbackstatus = true
resolution = 1280x720
marginheight = 80
dpi = 160
framerate = 30

[sensors]
location = true
night_mode = true
driving_status = true
