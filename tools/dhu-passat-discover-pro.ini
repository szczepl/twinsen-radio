; Desktop Head Unit - profil odwzorowujacy Passata B8 MY2020 z Discover Pro.
;
; UWAGA: to NIE jest profil wierny fizycznie, tylko wierny temu, co widac
; w aucie. Roznica jest istotna i wzieta z porownania zrzutow (2026-08-10).
;
; Fizycznie panel ma 1280x640 i przez dlugi czas tak bylo tu ustawione -
; 1280x720 obciete marginesem 80 px, sztuczka podpatrzona w default_wide.ini
; Google'a. Problem w tym, ze margines zmienia proporcje z 1,78 na 2,00, a przy
; 2:1 Android Auto przerzuca pasek aplikacji na lewa krawedz i nie da sie go
; zepchnac na dol. W aucie pasek jest NA DOLE, a odtwarzacz zajmuje cala
; szerokosc - czyli glowica zachowuje sie jak uklad 1,78. Dlatego marginesu tu
; nie ma.
;
; Gestosc 240 dpi, a nie fizyczne 156. Glowica dobiera gestosc do odleglosci
; patrzenia: ekran w aucie oglada sie z okolo 70 cm zamiast 30 cm jak telefon,
; wiec deklaruje mniej wiecej poltora raza wiecej, niz wynika z fizyki.
; 156 * 1,5 = 234, czyli standardowy kubelek hdpi. Uzytkownik rozpoznal ten
; uklad jako identyczny z tym, co widzi w Passacie.
;
; Przy okazji: niestandardowe dpi (jak 156) psulo rasteryzacje wektorow
; w projekcji. 240 jest kubelkiem standardowym i tego problemu nie ma.

[general]
touch = true
touchpad = false
touchpadnavigation = false
controller = false
instrumentcluster = false
playbackstatus = true
resolution = 1280x720
dpi = 240
framerate = 30

[sensors]
location = true
night_mode = true
driving_status = true
