; 1280x720 przy DPI 240.
;
; Po co: Android Auto decyduje o ukladzie na podstawie szerokosci ekranu
; w jednostkach niezaleznych od gestosci (dp), a nie w pikselach ani proporcjach.
; Nasze pomiary przy dpi = 160:
;
;   800x480  -> 800 dp  -> pasek aplikacji na dole, aplikacja na calym ekranie
;   1280x720 -> 1280 dp -> pulpit Coolwalk, pasek z lewej, odtwarzacz w panelu
;   1280x640 -> 1280 dp -> jak wyzej
;
; Przy dpi = 240 te same 1280 px to juz tylko 853 dp, czyli ponizej progu
; Coolwalk - powinnismy dostac duze, ostre okno i jednoczesnie pasek na dole
; oraz odtwarzacz na calej powierzchni.

[general]
touch = true
touchpad = false
touchpadnavigation = false
controller = false
instrumentcluster = false
playbackstatus = true
resolution = 1280x720
dpi = 240
framerate = 30

[sensors]
location = true
night_mode = true
driving_status = true
