; Dodatkowy ekran dla DHU 2.1. Doklada sie do profilu glownego:
;   desktop-head-unit.exe -c dhu-passat-composition.ini -c dhu-passat-cluster.ini
;
; UWAGA - to NIE jest podglad tego, co Passat rysuje na Active Info Display.
;
; Co ten profil faktycznie pokazuje: DisplayType=cluster daje w DHU okienko
; ze statusem telefonu - sila sygnalu i informacja o polaczeniach ("signal
; strength: 0", "No calls"). Tyle. Zadnej grafiki mediow ani nawigacji.
;
; Drugi wariant, DisplayType=auxiliary z WidgetType=navigation (patrz
; config/auxillary_nav.ini w katalogu DHU), pokazuje widget nawigacji - ale
; rowniez nie media.
;
; Dlaczego tak: kanal Instrument Cluster w protokole Android Auto przenosi
; wylacznie komunikaty nawigacyjne (INSTRUMENT_CLUSTER_NAVIGATION_STATE,
; ..._TURN_EVENT, ..._DISTANCE_EVENT). Sprawdzone w binarkach DHU 2.0 i 2.1 -
; nie ma tam ani jednego stringa o mediach. Kafelek muzyki miedzy zegarami
; rysuje sama glowica VW na podstawie pol MediaMetadata przeslanych przez sesje.
;
; Wniosek praktyczny: emulatora AID nie ma i nie bedzie. Ukladu pol na desce
; nie da sie sprawdzic inaczej niz w aucie.
;
; Marginesy ponizej odwzorowuja proporcje okienka miedzy zegarami: DHU rysuje
; do 800x480, a pokazuje srodek, czyli 400x400 px.

[display:cluster]
DisplayType=cluster
Resolution=800x480
PixelAspectRatio=1.0
DPI=160
FrameRate=30
MarginHeight=80
MarginWidth=400
CropMargins=true
StartupFocus=false
ViewingDistance=800
InputMode=dpad-1d

[keycodes:cluster]
dpad_center
