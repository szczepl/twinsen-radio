; Profil wirtualnego zegara/AID dla DHU 2.1. Doklada sie do profilu glownego:
;   desktop-head-unit.exe -c dhu-passat-discover-pro.ini -c dhu-passat-cluster.ini
;
; Po co marginesy: prawdziwy Digital Cockpit Pro w Passacie B8 ma 1280x480 na
; caly wyswietlacz, ale Android Auto dostaje tylko okienko miedzy zegarami.
; DHU modeluje to wlasnie przez MarginWidth/MarginHeight + CropMargins - rysuje
; do pelnej rozdzielczosci, a pokazuje wylacznie srodek. Przy ustawieniach
; ponizej widoczny obszar to 800-400 = 400 na 480-80 = 400 px, czyli mniej
; wiecej tyle, ile realnie zostaje na kafelek miedzy predkosciomierzem
; a obrotomierzem.
;
; DHU przyjmuje tylko wybrane rozdzielczosci (800x480, 1280x720, 1920x1080),
; wiec natywnych 1280x480 nie da sie tu wpisac.
;
; WAZNE: kanal clustera w protokole Android Auto przenosi wylacznie nawigacje
; (INSTRUMENT_CLUSTER_NAVIGATION_*). Podczas odtwarzania muzyki to okno
; zostanie puste - i tak ma byc. Tego, co Passat rysuje na AID przy graniu
; radia, nie da sie podejrzec na biurku; robi to sama glowica na podstawie pol
; MediaMetadata.

[display:cluster]
DisplayType=cluster
Resolution=800x480
PixelAspectRatio=1.0
DPI=160
FrameRate=30
MarginHeight=80
MarginWidth=400
CropMargins=true
StartupFocus=false
ViewingDistance=800
InputMode=dpad-1d

[keycodes:cluster]
dpad_center
